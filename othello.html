<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="1人用の無料オセロゲーム。CPUと対戦して戦略力を鍛えよう。難易度3段階あり。学生向けの暇つぶしにも最適。" />
    <title>1人用オセロゲーム｜CPU対戦（無料）</title>
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>
    <header>
        <h1>1人用オセロゲーム｜CPU対戦（無料）</h1>
        <a href="index.html">トップに戻る</a>
    </header>

    <div id="level-buttons">
        <button data-level="easy">初級</button>
        <button data-level="normal">中級</button>
        <button data-level="hard">上級</button>
    </div>

    <section id="status-bar">
        <p id="turn-indicator">現在の番：未選択</p>
        <p id="stone-count">黒：2　白：2</p>
    </section>

    <main>
        <div id="board" class="game-board"></div>
    </main>

    <footer>
        <div id="ad-container">
            <!-- Google AdSense 広告表示予定エリア -->
        </div>
        <p>本オセロゲームは、学生の思考力や戦略力を養うことを目的とした1人用AI対戦形式です。<br>
            個人開発・広告収益型の非営利サイトとして運営しています。</p>
    </footer>

    <script src="js/othello.js"></script>
</body>

</html>
