<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>無料で遊べる！AI対戦オセロ｜暇つぶしに最適な学生向けゲーム</title>
    <meta name="description" content="中高生・大学生向けの無料オセロゲーム！AIと対戦できる暇つぶし用ブラウザゲーム。スマホ・PC対応、難易度3段階。将棋も追加予定！">
    <link rel="stylesheet" href="css/style.css" />

    <!--
  このサイトは学生向けに設計されたオリジナルの暇つぶしゲームを提供するものであり、GitHub Pages上に手動で構築されています。
  内容はAI対戦機能つきのオセロゲームで、将来的に将棋や他のボードゲームも追加予定です。
  Google AdSenseのポリシーに従って収益化目的で利用します。
  -->
</head>

<body>
    <header>
        <h1>AIと対戦できる無料オセロゲーム｜学生向け暇つぶしゲーム</h1>
        <nav>
            <button id="select-othello">オセロ</button>
            <button id="select-shogi" disabled>将棋（準備中）</button>
        </nav>
    </header>

    <div id="level-buttons">
        <button data-level="easy">初級</button>
        <button data-level="normal">中級</button>
        <button data-level="hard">上級</button>
    </div>

    <section id="level-status">
        <p id="current-difficulty">現在の難易度：未選択</p>
    </section>

    <section id="status-bar">
        <p id="turn-indicator">現在の番：黒</p>
        <p id="stone-count">黒: 2　白: 2</p>
    </section>

    <main id="game-container"></main>

    <!-- 🔼 新しい広告表示枠（盤面下） -->
    <div id="ad-below-game">
        <!-- AdSense広告コード挿入予定 -->
    </div>

    <!-- 🔼 終了時広告ポップアップ枠（JavaScript側で出力） -->
    <div id="ad-endgame"></div>

    <footer>
        <div id="ad-container">
            <!-- Google AdSense 広告予定（フッター常時表示） -->
        </div>
    </footer>

    <script src="js/main.js"></script>
    <script src="js/othello.js"></script>
    <script src="js/ai/othelloAI.js"></script>
</body>

</html>
